[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum_sensor"
version = "0.2.0"
description = "Dark-matter quantum-sensor response analysis (TES/MKID)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "numba",
    "osqp",
    "clarabel",
]

[tool.setuptools.packages.find]
where = ["src"]

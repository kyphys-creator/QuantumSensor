[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum_sensor"
version = "0.1.0"
description = "Neutrino flux optimization analysis for TES detectors"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "numba",
]

[tool.setuptools.packages.find]
where = ["src"]
